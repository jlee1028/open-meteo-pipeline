[project]
name = "open-meteo-dagster"
version = "0.0.1"
description = "Open Meteo API Pipeline Orchestrated Using Dagster"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dagster",
    "dagster-webserver",
    "requests",
    "pydantic",
    "SQLAlchemy",
    "psycopg2-binary",
    "boto3",
]

[tool.dagster]
module_name = "dagster_pipelines.definitions"
code_location_name = "dagster_pipelines"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dagster_pipelines"]